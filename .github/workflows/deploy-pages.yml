# Builds the site and publishes it to GitHub Pages (indianwok.ca) whenever master changes.
# Needs: Settings → Pages → Source: "GitHub Actions" (one-time switch, done at launch).
# The custom domain stays in Settings → Pages; DNS at the domain registrar doesn't change.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
